spring:
  application:
    name: voting-ingest-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + idempotencia: um voto nao pode ser perdido num failover de lider, nem
      # duplicado por retry do produtor.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  port: 8081

voting:
  election-id: ${VOTING_ELECTION_ID:br-2026-presidencial}
  # Segredo do servidor. O valor abaixo e so para desenvolvimento: em producao vem do
  # ambiente e nunca do repositorio.
  receipt-pepper: ${VOTING_RECEIPT_PEPPER:pepper-de-desenvolvimento-trocar-em-producao}
  votes-topic: votes.cast
  receipts-topic: votes.receipts
  control-topic: votes.control
  send-timeout-ms: 5000
  # Periodo da votacao em ISO-8601. Vazio nos dois = eleicao sem prazo (so desenvolvimento).
  opens-at: ${VOTING_OPENS_AT:}
  closes-at: ${VOTING_CLOSES_AT:}
  # Batimento que mantem o tempo de evento andando quando ninguem esta votando. Precisa ser
  # confortavelmente menor que a janela da Merkle Tree, senao uma janela sem votos nao fecha
  # e os eleitores dela ficam sem prova de inclusao.
  heartbeat-interval-ms: ${VOTING_HEARTBEAT_MS:5000}
  # Margem somada ao fechamento para carimbar a sentinela. Precisa exceder o
  # watermark.out.of.orderness.ms do job (default 5000), senao a marca d'agua nao ultrapassa
  # a ultima janela e os ultimos votos ficam sem raiz.
  closing-margin-ms: ${VOTING_CLOSING_MARGIN_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.voting: INFO
