# Serve a pagina e encaminha /api para o servico de provas.
#
# O proxy nao existe por comodidade: ele deixa a pagina e a API na mesma origem, e assim o
# frontend nao depende de CORS configurado no servico Go para funcionar. E tambem nao muda
# nada quanto a confianca - a verificacao roda no navegador, e uma prova adulterada no
# caminho seria rejeitada pelo mesmo motivo que uma adulterada na origem.

server {
    listen 8084;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A pagina e pequena e muda com o deploy; o que nao pode acontecer e um eleitor auditar
    # uma versao do verify.js diferente da que esta executando.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://merkle:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Uma prova e uma resposta pequena; o timeout curto evita que a tela fique pendurada
        # quando o servico esta fora do ar.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
